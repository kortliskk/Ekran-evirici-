name: Ekran Cevirici Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP projesini çıkar
     - name: ZIP projesini çıkar
  run: |
    mkdir extracted
    ZIP=$(find . -maxdepth 1 -type f -iname '*DUZELTILMIS*.zip' | head -n 1)

    if [ -z "$ZIP" ]; then
      echo "Düzeltilmiş ZIP bulunamadı!"
      ls -la
      exit 1
    fi

    echo "Bulunan dosya: $ZIP"
    unzip -o "$ZIP" -d extracted

    PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

    if [ -z "$PROJECT" ]; then
      echo "Android projesi bulunamadı!"
      exit 1
    fi

    cp -a "$PROJECT"/. .
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android projesi bulunamadı!"
            exit 1
          fi
          cp -a "$PROJECT"/. .

      - name: Android SDK kur
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK oluştur
        run: gradle --no-daemon :app:assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: EKRAN-CEVIRICI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
